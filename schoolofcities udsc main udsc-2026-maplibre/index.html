<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8" />

	<title>MapLibre Example</title>

	<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />

	<style>

		html, body, #map {
			margin: 0;
			height: 100%;
			width: 100%;
		}

	</style>

</head>

<body>
	<div id="map"></div>

	<script>

		const map = new maplibregl.Map({

			container: 'map',
			center: [-79.3832, 43.6532],
			zoom: 12,
			bearing: 0,
			pitch: 0,
			style: 'map-style.json',
			projection: "vertical-perspective"

		});

		
		map.addControl(new maplibregl.NavigationControl());


		
	
		map.on('load', () => {

			map.addSource('transit-lines', {
				type: 'geojson',
				data: 'current-lines.geo.json',
			});

			map.addSource('transit-stations', {
				type: 'geojson',
				data: 'current-stations.geo.json',
			});

			map.addSource('city-wards', {
				type: 'geojson',
				data: 'city-wards.geojson',
			});

			map.addSource('red-light-cameras', {
				type: 'geojson',
				data: 'red-light-cameras.geojson',
			});

			map.addLayer({
				id: 'transit-lines',
				type: 'line',
				source: 'transit-lines',
				layout: { 'line-cap': 'round', 'line-join': 'round' },
				paint: { 'line-color': '#000000', 'line-width': 2 },
			});

			map.addLayer({
				id: 'transit-stations',
				type: 'circle',
				source: 'transit-stations',
				paint: {
					'circle-radius': 3,
					'circle-color': '#329da8',
					'circle-stroke-width': 1.5,
					'circle-stroke-color': '#ffffff',
				},
			});

			map.addLayer({
			id: 'red-light-cameras',
			type: 'circle',
			source: 'red-light-cameras',
			paint: {
				'circle-radius': 6,
				'circle-color': '#ff1414',
				'circle-stroke-width': 1.5,
				'circle-stroke-color': '#ffffff',
			},
		});

			map.addLayer({
				id: 'city-wards',
				type: 'line',
				source: 'city-wards',
				layout: { 'line-cap': 'round', 'line-join': 'round' },
				paint: { 'line-color': '#000000', 'line-width': 1 },
			});

			map.addLayer({
				id: 'city-wards',
				type: 'fill',
				source: 'city-wards',
				layout: { 'line-cap': 'round', 'line-join': 'round' },
				paint: { 'line-color': '#000000', 'line-width': 1 },
			});

		});


	</script>

</body>

</html>
